name: tgu_campus
description: 天津工业大学校园聚合助手（单人自用）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  html: ^0.15.6
  gbk_codec: ^0.4.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# path_provider_android 2.3.x 通过 package:jni 走 FFI，构建时要 NDK + CMake（≈800MB 工具链）。
# 我们只用到 getApplicationDocumentsDirectory，钉回 2.2.x 的纯 MethodChannel 实现，构建就不需要 NDK 了。
dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
