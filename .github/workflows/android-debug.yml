name: 构建 Debug APK

# 不需要在本机装 Flutter / JDK / Android SDK：
# 把项目推到 GitHub，在 Actions 里点一下，就能下载装到手机的 APK。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # 生成 android/ 并补上 INTERNET 权限、明文开关、minSdk 23
      - name: 准备 Android 工程
        run: node tools/prepare-android.mjs

      - run: flutter pub get

      # 本项目的断言集（纯 Dart，不依赖 Flutter）：解析器、加密、时间规则。
      # CI 里有真 Dart，所以比本机多跑一步静态检查。
      - name: 断言集
        run: |
          cd tools/verify
          dart pub get
          dart run bin/verify.dart

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 构建 APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: tgu-campus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
