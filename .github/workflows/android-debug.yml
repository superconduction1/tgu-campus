name: 构建 Debug APK

# 不需要在本机装 Flutter / JDK / Android SDK：
# 把项目推到 GitHub，在 Actions 里点一下，就能下载装到手机的 APK。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # 补丁脚本的自测（模拟 flutter create 覆盖文件后能还原），
      # 放在生成之前跑：脚本本身坏了就早点红，别等到 gradle 报一堆错。
      - name: 补丁脚本自测
        run: node tools/prepare-android.mjs --selftest

      # 生成 android/ 并补上 INTERNET 权限、明文开关、minSdk 23
      - name: 准备 Android 工程
        run: node tools/prepare-android.mjs

      - run: flutter pub get

      # Gradle 的依赖第一次要下几分钟，缓存起来第二次就快很多。
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 本项目的断言集（纯 Dart，不依赖 Flutter）：解析器、加密、时间规则。
      # CI 里有真 Dart，所以比本机多跑一步静态检查。
      - name: 断言集
        run: |
          cd tools/verify
          dart pub get
          dart run bin/verify.dart

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      # 这几个测试文件在本机跑不了（flutter test 要 spawn 测试进程，
      # 沙箱不允许），所以让 CI 第一次跑时顺便验证它们。
      # 故意不阻塞出包：测试挂了也要能先装上 APK 看主流程。
      - name: 单元测试（不阻塞出包）
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: 构建 APK（debug）
        run: flutter build apk --debug

      # 注：试过 --release / --split-per-abi 都在这套 runner 上直接失败
      # （step「构建 APK（release）」红，日志要登录才能看），
      # 所以先只出 debug 包；release 等真要上架再单独调。
      - uses: actions/upload-artifact@v4
        with:
          name: tgu-campus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
